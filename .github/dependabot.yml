version: 2
updates:
  # One root bun.lock covers packages/* and examples/*.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Pre-1.0 and changes generated output; its own PR so a failing
        # check:client (rerun generate:client) doesn't block the group.
        exclude-patterns: ['@hey-api/openapi-ts']
      major:
        update-types: [major]
        exclude-patterns: ['@hey-api/openapi-ts']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
