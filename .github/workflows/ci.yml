name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # The release job dispatches this on the Version Packages PR: PRs opened
  # with GITHUB_TOKEN start no pull_request runs, and `ci` is a required check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the changeset check can diff against origin/main.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun --bun run check

      - name: Lint
        run: bun --bun run lint

      - name: Typecheck
        run: bun run typecheck

      # A PR that changes a published package (packages/*, including the
      # generated client) needs a changeset, or `bunx changeset --empty`.
      # Dependabot can't write changesets.
      - name: Changeset check
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: bunx changeset status --since=origin/main

      # The committed client must match the spec (PLAN.md task 7.4).
      - name: Client drift check
        run: bun run check:client

      # Plain `bun run` (no --bun): vitest must run under node — bun's ws shim
      # lacks the 'upgrade' event the cloudflare workers pool needs.
      - name: Test
        run: bun run test

      - name: Build
        run: bun --bun run build
